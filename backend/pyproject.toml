[project]
name = "signvision-backend"
version = "1.0.0"
description = "Local SignBridge backend: isolated RSL sign recognition, learning progress and Training Studio"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
# Russian UI strings legitimately contain Cyrillic letters that look like Latin ones.
ignore = ["RUF001", "RUF002", "RUF003", "B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]
"alembic/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "onnxruntime", "onnxruntime.*", "onnx", "onnx.*", "mediapipe", "mediapipe.*",
          "sklearn", "sklearn.*", "joblib", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:google.*", "ignore::DeprecationWarning:mediapipe.*", "ignore::DeprecationWarning:starlette.testclient"]
